<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const isLeapYear = (year) =>
        year % 400 === 0 || (year % 4 === 0 && year % 100 !== 0);

      alert(isLeapYear(1800) ? "leap year" : "Not a leap year");
      alert(isLeapYear(2000) ? "leap year" : "Not a leap year");
      alert(isLeapYear(1700) ? "leap year" : "Not a leap year");
      alert(isLeapYear(2024) ? "leap year" : "Not a leap year");
    </script>
  </body>
</html>
