<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function unique(arr) {
        let n = arr.length;
        let newarr = [];
        for (let i = 0; i < n; i++) {
          let isDuplicate = false;
          for (let j = 0; j < newarr.length; j++) {
            if (arr[i] === arr[j]) {
              isDuplicate = true;
              break;
            }
          }
          if (!isDuplicate) {
            newarr.push(arr[i]);
          }
        }

        return newarr;
      }
      let strings = [
        "Hare",
        "Krishna",
        "Hare",
        "Krishna",
        "Krishna",
        "Krishna",
        "Hare",
        "Hare",
        ":-O",
      ];
      alert(unique(strings));
    </script>
  </body>
</html>
