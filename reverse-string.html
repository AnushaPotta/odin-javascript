<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function reverseString(str) {
        let newStr = "";
        let n = str.length;
        for (let i = n - 1; i >= 0; i--) {
          newStr += str[i];
        }
        return newStr;
      }
      let result = reverseString("Hello World!");
      alert(result);
    </script>
  </body>
</html>
