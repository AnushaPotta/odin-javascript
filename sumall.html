<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function sumAll(a, b) {
        let sum = 0;

        for (let i = a; i <= b; i++) {
          sum = sum + i;
          console.log(sum);
        }
        return sum;
      }
      let result = sumAll(1, 4);
      alert(result);
    </script>
  </body>
