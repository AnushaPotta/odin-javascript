  <body>
    <script>
      function sumOfTripledEvens(array) {
        return 3 * array;
      }
      arr = [1, 2, 3, 4, 5];
      const triple_array = arr.map(sumOfTripledEvens);
      console.log(triple_array);
    </script>
  </body>
