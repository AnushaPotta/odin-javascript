<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function sumOfTripledEvens(array) {
        if (array % 2 === 0) {
          return array;
        }
      }
      arr = [1, 2, 3, 4, 5];
      const even_array = arr.filter(sumOfTripledEvens);
      console.log(even_array);
      const triple_array = even_array.map((array) => 3 * array);
      console.log(triple_array);

      const sum = triple_array.reduce((accumulator, array) => {
        return accumulator + array;
      });
      console.log(sum);
    </script>
  </body>
</html>
