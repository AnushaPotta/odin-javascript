<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let x = prompt("Enter value of x");
      let n = prompt("Enter value of n");
      let result = 1;
      function pow(x, n) {
        for (let i = n; i >= 1; i--) {
          result = result * x;
        }
        return result;
      }
      if (n < 1) {
        alert(`Power ${n} is not a valid number. Please use positive integer`);
      } else {
        alert(pow(x, n));
      }
    </script>
  </body>
</html>
