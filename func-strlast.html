<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function lastLetter(str) {
        if (str.length === 0) return "";
        return str.at(-1);
      }
      console.log(lastLetter("hello"));
      console.log(lastLetter("javascript"));
    </script>
  </body>
</html>
