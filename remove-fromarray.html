<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function removeFromArray(arr, item) {
        return arr.filter((val) => !item.includes(val));
      }
      let array = [1, 2, 3, 4];
      let result = removeFromArray(array, [3]);
      alert(result);
    </script>
  </body>
</html>
