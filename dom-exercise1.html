<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- your HTML file: -->
    <h1>THE TITLE OF YOUR WEBPAGE</h1>
    <div id="container"></div>
    <script>
      // your JavaScript file
      const container = document.querySelector("#container");

      const content = document.createElement("div");
      content.classList.add("content");
      content.textContent = "This is the glorious text-content!";

      container.appendChild(content);
      const para = document.createElement("p");
      para.setAttribute("style", "color:red");
      para.textContent = "Hey I am red!";
      container.appendChild(para);
      const head = document.createElement("h3");
      head.style.color = "blue";
      head.textContent = "I'm a blue h3!";
      container.appendChild(head);
      const morecontent = document.createElement("div");
      morecontent.style.border = "2px, solid black";
      morecontent.style.backgroundColor = "pink";

      const head2 = document.createElement("h1");
      head2.textContent = "I'm in a div";
      morecontent.appendChild(head2);

      const para2 = document.createElement("p");
      para2.textContent = "ME TOO!";
      morecontent.appendChild(para2);

      container.appendChild(morecontent);
    </script>
  </body>
</html>
